<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Simlish — turn plain text into language-sounding nonsense, entirely in your browser."
    />
    <title>Simlish</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="page">
      <header class="hero">
        <p class="brand">Simlish</p>
        <h1 class="headline">Nonsense that still sounds like speech.</h1>
        <p class="lede">
          Paste a phrase. Get a stable, language-flavored rewrite — generated
          locally from phonotactic patterns, never sent anywhere.
        </p>
        <div class="hero-actions">
          <button type="button" class="btn btn-primary" id="translate-btn">
            Translate
          </button>
          <button type="button" class="btn btn-ghost" id="clear-btn">
            Clear
          </button>
        </div>
      </header>

      <main class="workspace">
        <div class="toolbar">
          <label class="field">
            <span class="field-label">Profile</span>
            <select id="lang-select" name="lang">
              <option value="en_US">English (US)</option>
              <option value="en_UK">English (UK)</option>
            </select>
          </label>
          <label class="toggle">
            <input type="checkbox" id="show-ipa" />
            <span>Show IPA</span>
          </label>
        </div>

        <div class="panels">
          <label class="panel">
            <span class="panel-label">Your text</span>
            <textarea
              id="input"
              rows="8"
              placeholder="Hello, world! Type anything…"
              spellcheck="true"
            ></textarea>
          </label>
          <div class="panel">
            <div class="panel-head">
              <span class="panel-label" id="output-label">Simlish</span>
              <button type="button" class="btn btn-ghost btn-sm" id="copy-btn">
                Copy
              </button>
            </div>
            <output
              id="output"
              class="output"
              for="input"
              aria-live="polite"
              aria-labelledby="output-label"
              tabindex="0"
            ></output>
          </div>
        </div>

        <p class="hint" id="status" role="status"></p>
      </main>

      <footer class="foot">
        <p>
          Client-side Markov phonotactics ·
          <a href="https://github.com/Jmat50/simlish">Source</a>
          · Profiles derived from
          <a href="https://github.com/open-dict-data/ipa-dict">ipa-dict</a>
        </p>
      </footer>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
